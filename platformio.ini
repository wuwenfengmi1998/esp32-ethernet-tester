; =============================================================================
; ESP32 Ethernet Tester - PlatformIO Configuration
; Hardware: ESP-WROOM32 + WIZnet W5500 Lite
; =============================================================================

[env:esp32dev]
platform         = espressif32
board            = esp32dev
framework        = arduino
monitor_speed    = 115200
monitor_filters  = direct
upload_speed     = 921600

build_flags =
    -DCORE_DEBUG_LEVEL=0
    -DARDUINO_RUNNING_CORE=1
    -O2

lib_deps =
    mathieucarbou/ESPAsyncWebServer @ ^3.3.0
