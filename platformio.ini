; =============================================================================
; ESP32 Ethernet Tester - PlatformIO Configuration
; Hardware: Waveshare ESP32-S3-POE-ETH (onboard WIZnet W5500)
; =============================================================================

[env:esp32-s3-poe-eth]
platform         = espressif32
board            = esp32-s3-devkitc-1
framework        = arduino
monitor_speed    = 115200
monitor_filters  = direct
upload_speed     = 921600

board_build.flash_mode = qio
board_build.flash_size = 16MB
; ESP32-S3-ETH carries 8 MB octal (OPI) PSRAM -> flash QIO + PSRAM OPI
board_build.arduino.memory_type = qio_opi
; 16 MB layout with a ~3 MB SPIFFS/LittleFS region for uploaded 802.1X certs
board_build.partitions = default_16MB.csv
board_build.filesystem = littlefs

build_flags =
    -DCORE_DEBUG_LEVEL=0
    -DARDUINO_RUNNING_CORE=1
    -DBOARD_HAS_PSRAM
    ; Route Serial to the native USB-C CDC port (not UART0 TX/RX pins)
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -O2

lib_deps =
    mathieucarbou/ESPAsyncWebServer @ ^3.3.0
